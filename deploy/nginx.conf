# HTTP configuration for use before a certificate is available. Replace example.com with your domain.
# Allow six model requests per minute per IP. This file is included inside the Nginx http block.
limit_req_zone $binary_remote_addr zone=shiyin_api:10m rate=6r/m;

server {
    listen 80;
    server_name example.com www.example.com;

    # Serve samples directly through Nginx with a 30-day cache.
    location /samples/ {
        alias /srv/shiyin/samples/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Model endpoint: allow longer timeouts for generation and limit request frequency.
    location /api/arrange {
        limit_req zone=shiyin_api burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @toomany;
        proxy_pass http://127.0.0.1:5178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        client_max_body_size 8k;
    }

    # Whole-song refinement uses a larger structured plan.
    location = /api/refine {
        limit_req zone=shiyin_api burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @toomany;
        proxy_pass http://127.0.0.1:5178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        client_max_body_size 128k;
    }

    # Scoped revision receives the current realized project; match the application limit.
    location = /api/revise-clip {
        limit_req zone=shiyin_api burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @toomany;
        proxy_pass http://127.0.0.1:5178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        client_max_body_size 12m;
    }

    location / {
        proxy_pass http://127.0.0.1:5178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @toomany {
        default_type application/json;
        return 429 '{"error":"请求太频繁，请过一会儿再试"}';
    }

    gzip on;
    gzip_types application/json text/markdown text/css application/javascript;
}
