# HTTPS 版：证书放在 /etc/nginx/cert/example.com.pem 和 /etc/nginx/cert/example.com.key
# （阿里云"数字证书管理服务"里申请免费证书，下载 Nginx 格式，改成这两个文件名上传即可）
limit_req_zone $binary_remote_addr zone=shiyin_api:10m rate=6r/m;

server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;
    ssl_certificate     /etc/nginx/cert/example.com.pem;
    ssl_certificate_key /etc/nginx/cert/example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 采样文件：Nginx 直接给，缓存 30 天
    location /samples/ {
        alias /srv/shiyin/samples/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 大模型接口：一次生成可能要 1–3 分钟，超时放宽；限制请求频率
    location /api/arrange {
        limit_req zone=shiyin_api burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @toomany;
        proxy_pass http://127.0.0.1:5178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        client_max_body_size 8k;
    }

    location / {
        proxy_pass http://127.0.0.1:5178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @toomany {
        default_type application/json;
        return 429 '{"error":"请求太频繁，请过一会儿再试"}';
    }

    gzip on;
    gzip_types application/json text/markdown text/css application/javascript;
}
