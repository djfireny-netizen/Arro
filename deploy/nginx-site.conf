# 官网（静态页，文件在 /srv/shiyin/site）。把 example.com 换成 SITE_DOMAIN，放到 /etc/nginx/conf.d/site.conf
server {
    listen 443 ssl http2;
    server_name example.com www.example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/shiyin/site;
    index index.html;
    gzip on; gzip_types text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff;
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://example.com$request_uri; }
}
